<label
    class="dzi-radio-button"
    [class.dzi-radio-button--checked]="checked"
    [class.dzi-radio-button--disabled]="disabled"
    [class.dzi-radio-button--error]="error"
    [class.dzi-radio-button--focused]="isFocused"
    [class.dzi-radio-button--sm]="size === 'sm'"
    [class.dzi-radio-button--md]="size === 'md'"
    [class.dzi-radio-button--lg]="size === 'lg'"
    [class.dzi-radio-button--primary]="color === 'primary'"
    [class.dzi-radio-button--success]="color === 'success'"
    [class.dzi-radio-button--error-color]="color === 'error'"
    [class.dzi-radio-button--warning]="color === 'warning'"
    [attr.for]="inputId"
>
    <!-- Visually hidden native radio for accessibility -->
    <input
        #inputEl
        type="radio"
        class="dzi-radio-button__input"
        [id]="inputId"
        [checked]="checked"
        [disabled]="disabled"
        [required]="required"
        [attr.name]="name"
        [attr.value]="value"
        [attr.aria-checked]="checked"
        [attr.aria-disabled]="disabled"
        [attr.aria-required]="required || null"
        [attr.aria-label]="ariaLabel || null"
        [attr.aria-labelledby]="ariaLabelledBy || null"
        [attr.aria-describedby]="ariaDescribedBy || null"
        [attr.tabindex]="disabled ? -1 : 0"
        (change)="onInputChange($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
    />

    <!-- Custom visual radio -->
    <span class="dzi-radio-button__box" aria-hidden="true">
        <!-- Radio inner dot -->
        <span class="dzi-radio-button__dot" [class.dzi-radio-button__dot--visible]="checked"></span>
    </span>

    <!-- Label content (projected) -->
    <span class="dzi-radio-button__label">
        <ng-content></ng-content>
    </span>
</label>
