<aside class="sidebar">
    <div class="sidebar-header">
        <div class="logo">
            <!-- Placeholder SVG for the logo based on the user's image -->
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 2L2 11V29L20 38L38 29V11L20 2Z" stroke="var(--color-primary)" stroke-width="2"
                    stroke-linejoin="round" />
                <path d="M20 2V38M2 11L38 29M2 29L38 11" stroke="var(--color-primary)" stroke-width="1.5"
                    stroke-dasharray="2 2" />
                <circle cx="20" cy="20" r="4" fill="var(--color-primary)" />
            </svg>
            <div class="logo-text">
                <span class="logo-main">DIZI</span>
                <span class="logo-sub">AUTOMATION</span>
            </div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section">
            <h3 class="nav-section-title">GUIDE</h3>
            <ul class="nav-list">
                @for (item of guideItems; track item.label) {
                <li class="nav-item">
                    <a [href]="item.link" class="nav-link">
                        <ziva-icon [iconName]="item.icon" iconColor="var(--color-text-secondary)"></ziva-icon>
                        <span>{{ item.label }}</span>
                    </a>
                </li>
                }
            </ul>
        </div>

        <div class="nav-section">
            <h3 class="nav-section-title">COMPONENTS</h3>
            <ul class="nav-list">
                @for (item of componentItems; track item.label) {
                <li class="nav-item">
                    <a [routerLink]="item.link" routerLinkActive="active" class="nav-link">
                        <ziva-icon [iconName]="item.icon" iconColor="var(--color-text-secondary)"></ziva-icon>
                        <span>{{ item.label }}</span>
                    </a>
                </li>
                }
            </ul>
        </div>
    </nav>

    <div class="sidebar-footer">
        <span class="v-tag">v0.0.1</span>
    </div>
</aside>
