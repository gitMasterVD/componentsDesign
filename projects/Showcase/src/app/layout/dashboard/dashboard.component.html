<div class="dashboard-wrapper">
    <header class="top-nav">
        <div class="header-left">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 2L2 11V29L20 38L38 29V11L20 2Z" stroke="var(--color-primary)" stroke-width="2"
                        stroke-linejoin="round" />
                    <path d="M20 2V38M2 11L38 29M2 29L38 11" stroke="var(--color-primary)" stroke-width="1.5"
                        stroke-dasharray="2 2" />
                    <circle cx="20" cy="20" r="4" fill="var(--color-primary)" />
                </svg>
                <span class="logo-text">DIZI AUTOMATION</span>
            </div>
        </div>

        <div class="header-right">
            <nav class="nav-links">
                @for (item of navItems; track item.label) {
                <a [routerLink]="item.path" class="nav-tab" [class.active]="isActive(item.path)">
                    {{ item.label }}
                </a>
                }
            </nav>
        </div>
    </header>

    <main class="dashboard-content">
        <router-outlet></router-outlet>
    </main>
</div>
